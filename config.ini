[app]
log_level = INFO
incremental_mode = False
is_check_model_file = False
is_check_dll_file = False
proxy = 
ui_language = auto
main_image_path = assets\image_001.png
main_transparency = 100
result_image_path = assets\image_001.png
result_transparency = 100

[transcription]
engine = funasr
whisper_model = faster-whisper-large-v3-turbo-ct2
whisper_device = cuda
whisper_language = auto
whisper_beam_size = 5
whisper_best_of = 5
whisper_temperature = 0.0,0.2,0.4
whisper_compute_type = float32
whisper_num_workers = 1
whisper_vad_filter = False
whisper_condition_on_previous_text = False
whisper_word_timestamps = False
whisper_compression_ratio_threshold = 2.4
whisper_log_prob_threshold = -1.0
whisper_no_speech_threshold = 0.6
whisper_repetition_penalty = 1.0
whisper_no_repeat_ngram_size = 3
whisper_vad_threshold = 0.5
whisper_vad_min_silence_ms = 2000
whisper_vad_speech_pad_ms = 400
whisper_vad_max_speech_s = 0
funasr_model = paraformer-large-vad-punc
funasr_device = auto
funasr_language = zh
funasr_num_workers = 4
funasr_compute_type = int8
funasr_punc_filter = True
funasr_vad_filter = True
funasr_vad_max_end_sil = 800

[summarization]
provider = amd
ollama_url = http://127.0.0.1:11434
model_name = qwen2.5:7b-instruct-q4_K_M
max_length = 10000
temperature = 0.7
timeout = 30
nvidia_api_url = https://integrate.api.nvidia.com/v1/chat/completions
nvidia_model = minimaxai/minimax-m3
nvidia_max_tokens = 4096
nvidia_temperature = 1.0
nvidia_top_p = 1.0
nvidia_frequency_penalty = 0.0
nvidia_presence_penalty = 0.0
nvidia_timeout = 30
nvidia_mode = multi
nvidia_thread_count = 5
nvidia_stream = True
mistral_base_url = https://api.mistral.ai
mistral_model = codestral-2508
mistral_rate_limit = 2.0
mistral_max_tokens = 10000
mistral_temperature = 0.7
mistral_timeout = 30
mistral_mode = multi
mistral_stream = True
mistral_thread_count = 4
amd_api_url = https://developer.amd.com.cn/radeon/api/v1/chat/completions
amd_model = DeepSeek-V4-Flash
amd_max_tokens = 8192
amd_temperature = 0.7
amd_timeout = 30
amd_mode = single
amd_thread_count = 4
amd_stream = True

[preprocessing]
audio_sample_rate = 16000
audio_channels = 1
max_chunk_duration = 300
supported_video_formats = .mp4,.avi,.mov,.mkv,.flv,.wmv,.webm,.ts,.mts,.m4v,.3gp,.mpeg,.mpg,.vob,.ogv,.rm,.rmvb
supported_audio_formats = .mp3,.wav,.flac,.aac,.ogg,.m4a,.wma

[output]
output_dir = output
transcript_format = txt
summary_format = md
mirror_enabled = True
mirror_depth = 1

[paths]
models_dir = models
logs_dir = logs
video_dir = video

[text_processing]
max_gap = 2.0
min_length = 50
filler_words = 

